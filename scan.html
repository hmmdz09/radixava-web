<!doctype html>
<html lang="id" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hai, Sobat Radixava! — Scan QR</title>
  <meta name="description" content="Halaman sambutan setelah scan QR kemasan Radixava.">
  <meta name="theme-color" content="#1E4A22">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,500..800,100,1;1,9..144,500..800,100,1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="scan">
<!-- URL QR per varian:  scan.html?v=singkong-crunch | purple-savory | golden-herb | brown-aren | seaweed -->
<main id="main">
  <section class="qr-hero" id="qrHero">
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="container" style="padding-top:90px">
      <div class="qr-card reveal">
        <img class="pack-mini" id="qrPack" src="" alt="" width="120" height="180">
        <span class="hand" id="qrHand">Hai, Sobat Radixava!</span>
        <h1 style="font-size:clamp(2rem,5vw,3rem);margin-top:10px" id="qrTitle">Makasih udah pilih Tri-Crunch 💚</h1>
        <p class="lead" style="margin-inline:auto" id="qrLead">Kamu baru saja ikut mengurangi limbah onggok. Mau ngapain dulu?</p>
        <div class="qr-actions">
          <a class="qr-action" id="qaFact" href="onggok.html#funfact">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>
            <b>Cari tahu rahasianya</b><small id="qaFactSub">Fun fact bahan di balik rasamu</small>
          </a>
          <a class="qr-action qr-action--main" id="qaStory" href="cerita.html#tulis">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
            <b>Bagikan ceritamu</b><small>1 menit, bantu kami berkembang</small>
          </a>
          <a class="qr-action" href="legalitas.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
            <b>Cek legalitas</b><small>Izin, halal & uji lab produk</small>
          </a>
        </div>
        <p style="margin:24px 0 0"><a class="link-arrow" href="index.html">Jelajahi website Radixava <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></p>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="ex-q reveal" id="qrQA" style="max-width:860px;margin:0 auto">
        <span class="hand" id="qrQ"></span>
        <p id="qrA"></p>
      </div>
    </div>
  </section>
</main>
<script src="assets/js/data.js"></script>
<script>
window.RXpage = (window.RXpage || []).concat(function (h) {
  var q = new URLSearchParams(location.search).get("v");
  var v = h.vBySlug(q);
  var hero = h.$("#qrHero");
  var base = v || { color: "#2F6B2F", soft: "#E3EFD3", deep: "#1E4A22", front: "front-purple-savory", name: "Tri-Crunch", question: h.RX.variants[2].question, answer: h.RX.variants[2].answer };
  hero.setAttribute("style", h.vStyle(base));
  h.$("#qrQA").setAttribute("style", h.$("#qrQA").getAttribute("style") + ";" + h.vStyle(base));
  h.$("#qrPack").src = "assets/img/" + base.front + ".webp";
  h.$("#qrPack").alt = "Kemasan " + base.name;
  if (v) {
    h.$("#qrTitle").textContent = "Selamat menikmati " + v.name + "!";
    h.$("#qaFact").href = "varian.html?v=" + v.slug;
    h.$("#qaFactSub").textContent = v.question;
    h.$("#qaStory").href = "cerita.html?v=" + v.slug + "#tulis";
  }
  h.$("#qrQ").textContent = base.question; h.$("#qrA").textContent = base.answer;

  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    var c = h.$("#confetti"), html = "";
    for (var i = 0; i < 26; i++) {
      html += '<i style="left:' + (Math.random() * 100) + '%;animation-duration:' + (3 + Math.random() * 3) + 's;animation-delay:' + (Math.random() * 1.2) + 's;transform:scale(' + (.6 + Math.random()) + ')"></i>';
    }
    c.innerHTML = html;
  }
});
</script>
<script src="assets/js/app.js"></script>
</body>
</html>
